name: 发布 MSM Assistant 浏览器扩展

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'msm-assistant 源标签、分支或完整提交 SHA（如 v2.1.0）'
        required: true
        default: 'v2.1.0'
        type: string
      force_update:
        description: '覆盖已存在的文档站静态发行包目录（docs/public/downloads/assistant/v*）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: publish-assistant
  cancel-in-progress: false

jobs:
  publish:
    name: 构建、验证并发布三平台扩展静态包
    runs-on: ubuntu-latest
    steps:
      - name: Checkout msm-wiki 主分支
        uses: actions/checkout@v4
        with:
          ref: main
          path: wiki
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout msm-assistant 源码
        uses: actions/checkout@v4
        with:
          repository: msm9527/msm-assistant
          ref: ${{ inputs.source_ref }}
          path: assistant-src
          token: ${{ secrets.MSM_REPO_TOKEN }}
          persist-credentials: false

      - name: 读取版本与发布元数据
        id: meta
        shell: bash
        env:
          FORCE_UPDATE: ${{ inputs.force_update }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./assistant-src/package.json').version")"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "invalid version: $VERSION" >&2; exit 1; }
          TARGET_REL_DIR="docs/public/downloads/assistant/v${VERSION}"
          COMMIT_SHA="$(git -C assistant-src rev-parse HEAD)"
          COMMIT_SHA_SHORT="$(git -C assistant-src rev-parse --short HEAD)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "target_rel_dir=${TARGET_REL_DIR}" >> "$GITHUB_OUTPUT"
          echo "commit_sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "commit_sha_short=${COMMIT_SHA_SHORT}" >> "$GITHUB_OUTPUT"

          if [ "${FORCE_UPDATE}" != "true" ] && [ -f "wiki/${TARGET_REL_DIR}/SHA256SUMS" ]; then
            echo "检测到 ${TARGET_REL_DIR} 已存在且未开启 force_update，跳过发布。"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=0" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.meta.outputs.skip == '0'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: assistant-src/package-lock.json

      - name: 安装依赖并执行基础校验与构建
        if: steps.meta.outputs.skip == '0'
        working-directory: assistant-src
        run: |
          npm ci
          npm run format:check
          npm test
          npm run build
          npm run lint:firefox

      - name: 安装 Playwright Chromium
        if: steps.meta.outputs.skip == '0'
        working-directory: assistant-src
        run: npx playwright install --with-deps chromium

      - name: 验证 Chrome 与 Edge 扩展包
        if: steps.meta.outputs.skip == '0'
        working-directory: assistant-src
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(node --input-type=module -e 'import {chromium} from "@playwright/test"; console.log(chromium.executablePath())')"
          CHROMIUM_PATH="$CHROME_BIN" EXT_TARGET=chrome npm run test:browser
          CHROMIUM_PATH="$CHROME_BIN" EXT_TARGET=edge npm run test:browser

      - name: 打包三平台发行包与 SHA256SUMS
        if: steps.meta.outputs.skip == '0'
        working-directory: assistant-src
        run: |
          node scripts/package.mjs
          ls -la dist/msm-assistant-*.zip dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)

      - name: 同步静态发行包到文档站目录（不创建 msm-wiki GitHub Release）
        if: steps.meta.outputs.skip == '0'
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TARGET_REL_DIR: ${{ steps.meta.outputs.target_rel_dir }}
          COMMIT_SHA_SHORT: ${{ steps.meta.outputs.commit_sha_short }}
        run: |
          set -euo pipefail
          TARGET_DIR="wiki/${TARGET_REL_DIR}"
          rm -rf "${TARGET_DIR}"
          mkdir -p "${TARGET_DIR}"

          for browser in chrome edge firefox; do
            SRC="assistant-src/dist/msm-assistant-${VERSION}-${browser}.zip"
            test -f "${SRC}"
            install -m 0644 "${SRC}" "${TARGET_DIR}/msm-assistant-${VERSION}-${browser}.zip"
          done
          install -m 0644 "assistant-src/dist/SHA256SUMS" "${TARGET_DIR}/SHA256SUMS"
          (cd "${TARGET_DIR}" && sha256sum -c SHA256SUMS)

          node - "${VERSION}" "${COMMIT_SHA_SHORT}" "${TARGET_DIR}/SHA256SUMS" "wiki/docs/public/downloads/assistant/latest.json" <<'NODE'
          const fs = require('node:fs');
          const [version, commit, sumsPath, outPath] = process.argv.slice(2);
          const sums = new Map();
          for (const line of fs.readFileSync(sumsPath, 'utf8').trim().split(/\r?\n/)) {
            const match = line.trim().match(/^([0-9a-f]{64})\s+\*?(.+)$/i);
            if (match) sums.set(match[2].trim(), match[1].toLowerCase());
          }
          const files = {};
          for (const browser of ['chrome', 'edge', 'firefox']) {
            const name = `msm-assistant-${version}-${browser}.zip`;
            const sha256 = sums.get(name);
            if (!sha256) throw new Error(`missing checksum for ${name}`);
            files[browser] = { name, sha256 };
          }
          files.checksums = 'SHA256SUMS';
          const manifest = {
            version,
            published_at: new Date().toISOString().replace(/\.\d{3}Z$/, 'Z'),
            source_commit: commit,
            base_url: `https://doc.msmbox.net/downloads/assistant/v${version}`,
            files,
          };
          fs.writeFileSync(outPath, `${JSON.stringify(manifest, null, 2)}\n`, 'utf8');
          NODE

          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${TARGET_REL_DIR}" "docs/public/downloads/assistant/latest.json"
          if git diff --cached --quiet; then
            echo "静态发行包内容无变化，无需提交。"
            exit 0
          fi

          git commit -m "chore(assistant): 发布浏览器助手 v${VERSION} 静态发行包 / Publish MSM Assistant v${VERSION} static packages"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "推送 msm-wiki main 失败，已耗尽重试" >&2
              exit 1
            fi
            git fetch origin main
            git rebase origin/main
          done

          {
            echo "## 🧩 MSM Assistant v${VERSION} 静态发行包已同步"
            echo ""
            echo "- Chrome: https://doc.msmbox.net/downloads/assistant/v${VERSION}/msm-assistant-${VERSION}-chrome.zip"
            echo "- Edge: https://doc.msmbox.net/downloads/assistant/v${VERSION}/msm-assistant-${VERSION}-edge.zip"
            echo "- Firefox: https://doc.msmbox.net/downloads/assistant/v${VERSION}/msm-assistant-${VERSION}-firefox.zip"
            echo "- SHA256SUMS: https://doc.msmbox.net/downloads/assistant/v${VERSION}/SHA256SUMS"
            echo "- 源码提交: \`${COMMIT_SHA_SHORT}\`"
          } >> "$GITHUB_STEP_SUMMARY"
