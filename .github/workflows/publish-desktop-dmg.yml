name: 补发已发布版本的 macOS DMG

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag, e.g. beta-2.2.6'
        required: true
        type: string
      source_commit:
        description: 'Exact source SHA recorded in the release'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-dmg-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  desktop:
    name: 补发 macOS 桌面应用（DMG 与更新归档）
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-amd64
            runs_on: macos-26-intel
            goos: darwin
            goarch: amd64
            macho_arch: x86_64
          - target: darwin-arm64
            runs_on: macos-26
            goos: darwin
            goarch: arm64
            macho_arch: arm64
    steps:
      - name: 验证发布版本和源提交
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^(beta-)?[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid release tag" >&2; exit 1; }
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "source commit must be a full SHA" >&2; exit 1; }
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.body' > "$RUNNER_TEMP/msm-release-body.md"
          grep -F "**源提交**" "$RUNNER_TEMP/msm-release-body.md" | grep -Fq "https://github.com/msm9527/msm/commit/${SOURCE_COMMIT})"

      - name: Checkout MSM 仓库
        uses: actions/checkout@v4
        with:
          repository: msm9527/msm
          ref: ${{ inputs.source_commit }}
          token: ${{ secrets.MSM_REPO_TOKEN }}

      - name: 检查原生 macOS 构建环境
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "macos/Package.swift" ] || [ ! -f "scripts/build-macos-app.sh" ]; then
            echo "error: 目标源提交缺少原生 macOS 应用构建文件 (macos/Package.swift / scripts/build-macos-app.sh)" >&2
            exit 1
          fi
          xcodebuild -version
          swift --version
          xcrun --show-sdk-version

      - name: 运行 macOS 桌面核心单元测试
        shell: bash
        run: |
          set -euo pipefail
          cd macos
          swift test

      - name: 下载并校验已发布的 macOS CLI
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          SOURCE_VERSION="$(tr -d '[:space:]' < .version)"
          [[ "$SOURCE_VERSION" == "${RELEASE_TAG#beta-}" ]] || { echo "source version does not match release" >&2; exit 1; }
          ARCHIVE="msm-${RELEASE_TAG}-${RELEASE_TARGET}.tar.gz"
          mkdir -p dist
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$ARCHIVE" --pattern SHA256SUMS --dir dist
          cd dist
          awk -v archive="$ARCHIVE" '$2 == archive { print; found++ } END { exit(found != 1) }' SHA256SUMS > expected.sha256
          shasum -a 256 -c expected.sha256

      - name: 解压并校验 CLI 二进制
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.release_tag }}"
          mkdir -p dist
          # 解压出合并后的单一 msm 可执行文件。
          tar -xzf "dist/msm-${VERSION}-${{ matrix.target }}.tar.gz" -C dist
          ls -l dist

          CLI_ARCHS="$(lipo -archs dist/msm)"
          if [ "${CLI_ARCHS}" != "${{ matrix.macho_arch }}" ]; then
            echo "error: CLI 架构不匹配，期望 ${{ matrix.macho_arch }}，实际 ${CLI_ARCHS}" >&2
            exit 1
          fi
          codesign --verify --strict --verbose=4 dist/msm
          if [ -f "scripts/verify-executable-sha256.sh" ]; then
            bash scripts/verify-executable-sha256.sh dist/msm
          fi
          dist/msm --version >/dev/null
          echo "CLI 架构与完整性验证通过: ${CLI_ARCHS}"

      - name: 构建原生 macOS 桌面应用（.app / .dmg / 更新包）
        id: build_desktop
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.release_tag }}"
          BASE_VERSION="${VERSION#beta-}"
          EXPECTED_ARCH="${{ matrix.macho_arch }}"
          DIST_ROOT="$PWD/dist"
          APP_OUT="$DIST_ROOT/macos-app"

          # 复用已发布并校验完成的加固版 msm 后端二进制（已内嵌前端资源），
          # 由原生 SwiftUI 工程组装 msm-desktop.app。
          # Reuse the verified published hardened msm backend binary (with embedded frontend)
          # and assemble msm-desktop.app from the native SwiftUI package.
          rm -rf "$APP_OUT"
          MSM_PREBUILT_BACKEND_BIN="$DIST_ROOT/msm" \
            bash scripts/build-macos-app.sh \
              --arch "$EXPECTED_ARCH" \
              --output "$APP_OUT" \
              --configuration release \
              --skip-frontend \
              --skip-backend

          APP_PATH="$APP_OUT/msm-desktop.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "error: 未找到原生 macOS .app 产物: $APP_PATH" >&2
            exit 1
          fi

          APP_EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Contents/Info.plist")"
          if [ "$APP_EXECUTABLE" != "msm-desktop" ]; then
            echo "error: CFBundleExecutable 异常，期望 msm-desktop，实际 ${APP_EXECUTABLE}" >&2
            exit 1
          fi
          MIN_OS="$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP_PATH/Contents/Info.plist")"
          if [ "$MIN_OS" != "26.0" ]; then
            echo "error: LSMinimumSystemVersion 异常，期望 26.0，实际 ${MIN_OS}" >&2
            exit 1
          fi
          APP_ARCHS="$(lipo -archs "$APP_PATH/Contents/MacOS/$APP_EXECUTABLE")"
          if [ "$APP_ARCHS" != "$EXPECTED_ARCH" ]; then
            echo "error: 原生 App 架构不匹配，期望 ${EXPECTED_ARCH}，实际 ${APP_ARCHS}" >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=4 "$APP_PATH"
          echo "原生 App 架构与签名验证通过: ${APP_ARCHS}"

          BUNDLED_MSM="$APP_PATH/Contents/Resources/msm"
          if [ ! -x "$BUNDLED_MSM" ]; then
            echo "error: 原生 App 缺少可执行内置后端: $BUNDLED_MSM" >&2
            exit 1
          fi
          BUNDLED_MSM_ARCHS="$(lipo -archs "$BUNDLED_MSM")"
          if [ "$BUNDLED_MSM_ARCHS" != "$EXPECTED_ARCH" ]; then
            echo "error: 内置后端架构不匹配，期望 ${EXPECTED_ARCH}，实际 ${BUNDLED_MSM_ARCHS}" >&2
            exit 1
          fi
          cmp -s "$DIST_ROOT/msm" "$BUNDLED_MSM"
          codesign --verify --strict --verbose=4 "$BUNDLED_MSM"
          if [ -f "scripts/verify-executable-sha256.sh" ]; then
            bash scripts/verify-executable-sha256.sh "$BUNDLED_MSM"
          fi
          "$BUNDLED_MSM" --version >/dev/null
          echo "内置后端一致性、签名与可执行性验证通过: ${BUNDLED_MSM_ARCHS}"

          # 打包供桌面端在线更新使用的无签名 .app.tar.gz（由 GitHub Release SHA-256 校验）
          # Package the unsigned .app.tar.gz archive verified via GitHub Release SHA-256 digest.
          OUTPUT_UPDATER="$DIST_ROOT/msm-desktop-${BASE_VERSION}-darwin-${EXPECTED_ARCH}.app.tar.gz"
          UPDATER_TEMP="${OUTPUT_UPDATER}.tmp.$$"
          COPYFILE_DISABLE=1 tar --no-xattrs -czf "$UPDATER_TEMP" -C "$APP_OUT" "msm-desktop.app"
          mv "$UPDATER_TEMP" "$OUTPUT_UPDATER"
          tar -tzf "$OUTPUT_UPDATER" | grep -Fx "msm-desktop.app/Contents/MacOS/msm-desktop" >/dev/null
          tar -tzf "$OUTPUT_UPDATER" | grep -Fx "msm-desktop.app/Contents/Resources/msm" >/dev/null
          if tar -tzf "$OUTPUT_UPDATER" | grep -Eq '(^|/)\._'; then
            echo "error: 更新压缩包包含 AppleDouble 元数据文件: $OUTPUT_UPDATER" >&2
            exit 1
          fi
          echo "updater_archive=dist/msm-desktop-${BASE_VERSION}-darwin-${EXPECTED_ARCH}.app.tar.gz" >> "$GITHUB_OUTPUT"
          echo "桌面更新归档校验通过: $OUTPUT_UPDATER"

          # 隔离临时目录并重试创建 DMG（规避 headless CI 上 hdiutil 偶发挂载竞争）
          # Isolate staging/output directories and retry hdiutil create on headless CI runners.
          mkdir -p "$DIST_ROOT"
          OUTPUT_DMG="$DIST_ROOT/msm-desktop-${VERSION}-${{ matrix.target }}.dmg"

          DMG_STAGE="$(mktemp -d)"
          DMG_WORK="$(mktemp -d)"
          DMG_TEMP="$DMG_WORK/msm-desktop.dmg"
          cleanup_dmg_files() {
            rm -rf "$DMG_STAGE" "$DMG_WORK"
          }
          trap cleanup_dmg_files EXIT

          cp -R "$APP_PATH" "$DMG_STAGE/"
          ln -s /Applications "$DMG_STAGE/Applications"

          VOL_NAME="MSM ${BASE_VERSION}"
          DMG_CREATED="false"
          for attempt in 1 2 3; do
            if hdiutil create \
              -volname "$VOL_NAME" \
              -srcfolder "$DMG_STAGE" \
              -fs HFS+ \
              -format UDZO \
              -ov \
              "$DMG_TEMP"; then
              DMG_CREATED="true"
              break
            fi
            rm -f "$DMG_TEMP"
            if [ "$attempt" -lt 3 ]; then
              echo "hdiutil create 第 ${attempt} 次失败，等待后重试"
              sleep "$attempt"
            fi
          done
          if [ "$DMG_CREATED" != "true" ]; then
            echo "error: hdiutil create 重试 3 次仍失败" >&2
            exit 1
          fi
          rm -f "$OUTPUT_DMG"
          mv "$DMG_TEMP" "$OUTPUT_DMG"

          MOUNT_DIR="$(mktemp -d)"
          cleanup_dmg_mount() {
            hdiutil detach "$MOUNT_DIR" >/dev/null 2>&1 || true
            rmdir "$MOUNT_DIR" >/dev/null 2>&1 || true
            cleanup_dmg_files
          }
          trap cleanup_dmg_mount EXIT

          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT_DIR" "$OUTPUT_DMG" >/dev/null
          APP_IN_DMG="$MOUNT_DIR/msm-desktop.app"
          if [ ! -d "$APP_IN_DMG" ]; then
            echo "error: DMG 中未找到 msm-desktop.app: $OUTPUT_DMG" >&2
            exit 1
          fi

          DMG_APP_EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_IN_DMG/Contents/Info.plist")"
          DMG_APP_ARCHS="$(lipo -archs "$APP_IN_DMG/Contents/MacOS/$DMG_APP_EXECUTABLE")"
          if [ "$DMG_APP_ARCHS" != "$EXPECTED_ARCH" ]; then
            echo "error: DMG App 架构不匹配，期望 ${EXPECTED_ARCH}，实际 ${DMG_APP_ARCHS}" >&2
            exit 1
          fi
          codesign --verify --deep --strict "$APP_IN_DMG"
          echo "DMG 架构与签名验证通过: ${DMG_APP_ARCHS}"

          DMG_BUNDLED_MSM="$APP_IN_DMG/Contents/Resources/msm"
          if [ ! -x "$DMG_BUNDLED_MSM" ]; then
            echo "error: DMG 中缺少可执行内置后端: $DMG_BUNDLED_MSM" >&2
            exit 1
          fi
          DMG_BUNDLED_MSM_ARCHS="$(lipo -archs "$DMG_BUNDLED_MSM")"
          if [ "$DMG_BUNDLED_MSM_ARCHS" != "$EXPECTED_ARCH" ]; then
            echo "error: DMG 内置后端架构不匹配，期望 ${EXPECTED_ARCH}，实际 ${DMG_BUNDLED_MSM_ARCHS}" >&2
            exit 1
          fi
          codesign --verify --strict --verbose=4 "$DMG_BUNDLED_MSM"
          "$DMG_BUNDLED_MSM" --version >/dev/null
          echo "DMG 内置后端签名和可执行性验证通过: ${DMG_BUNDLED_MSM_ARCHS}"

          cleanup_dmg_mount
          trap - EXIT

      - name: 上传桌面应用 DMG 产物
        uses: actions/upload-artifact@v4
        with:
          name: msm-desktop-${{ inputs.release_tag }}-${{ matrix.target }}
          path: dist/msm-desktop-${{ inputs.release_tag }}-${{ matrix.target }}.dmg
          if-no-files-found: error

      - name: 上传桌面应用更新归档产物
        uses: actions/upload-artifact@v4
        with:
          name: msm-desktop-updater-${{ inputs.release_tag }}-${{ matrix.target }}
          path: ${{ steps.build_desktop.outputs.updater_archive }}
          if-no-files-found: error

      - name: 将 DMG 附加到已有 Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: sh
        run: |
          set -eu
          gh release upload "${{ inputs.release_tag }}" \
            "dist/msm-desktop-${{ inputs.release_tag }}-${{ matrix.target }}.dmg" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

  desktop-manifest:
    name: 补发 macOS 桌面在线更新清单
    needs: [desktop]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout MSM 仓库
        uses: actions/checkout@v4
        with:
          repository: msm9527/msm
          ref: ${{ inputs.source_commit }}
          token: ${{ secrets.MSM_REPO_TOKEN }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 下载 Apple Silicon 桌面更新归档
        uses: actions/download-artifact@v4
        with:
          name: msm-desktop-updater-${{ inputs.release_tag }}-darwin-arm64
          path: dist

      - name: 下载 Intel 桌面更新归档
        uses: actions/download-artifact@v4
        with:
          name: msm-desktop-updater-${{ inputs.release_tag }}-darwin-amd64
          path: dist

      - name: 生成并发布桌面更新归档与清单
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_VERSION="${RELEASE_TAG#beta-}"
          SOURCE_VERSION="$(tr -d '[:space:]' < .version)"
          [[ "$SOURCE_VERSION" == "$BASE_VERSION" ]] || { echo "source version does not match release" >&2; exit 1; }

          ARM64_ARCHIVE="dist/msm-desktop-${BASE_VERSION}-darwin-arm64.app.tar.gz"
          X64_ARCHIVE="dist/msm-desktop-${BASE_VERSION}-darwin-x86_64.app.tar.gz"
          test -s "$ARM64_ARCHIVE"
          test -s "$X64_ARCHIVE"

          node scripts/generate-desktop-update-manifest.mjs "${BASE_VERSION}" dist "${RELEASE_TAG}"
          test -s dist/msm-desktop-latest.json

          # 先上传双架构 .app.tar.gz，全部成功后再发布 msm-desktop-latest.json
          # Upload both architecture updater archives before publishing msm-desktop-latest.json.
          gh release upload "${RELEASE_TAG}" \
            "$ARM64_ARCHIVE" \
            "$X64_ARCHIVE" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
          gh release upload "${RELEASE_TAG}" \
            "dist/msm-desktop-latest.json" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
