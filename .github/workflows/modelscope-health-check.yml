name: AI 真实健康检查

on:
  workflow_dispatch:
    inputs:
      model:
        description: '可选：本次检查使用的模型 ID，不修改正式发布配置'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  inference:
    name: 验证真实模型调用与发布摘要格式
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Wiki
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 真实 AI 推理与安全诊断
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL || vars.AI_BASE_URL || '' }}
          AI_WIRE_API: ${{ secrets.AI_WIRE_API || vars.AI_WIRE_API || 'responses' }}
          AI_MODEL: ${{ inputs.model || secrets.AI_MODEL || vars.AI_MODEL || '' }}
          AI_REQUIRES_OPENAI_AUTH: ${{ secrets.AI_REQUIRES_OPENAI_AUTH || vars.AI_REQUIRES_OPENAI_AUTH || 'true' }}
        run: node test-modelscope-api.js
