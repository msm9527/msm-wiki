name: Deploy Wiki to GitHub Pages

on:
  push:
    branches:
      - main
    # 只在文档 / 站点相关文件发生变更时自动触发部署
    paths:
      - 'docs/**'
      - 'docs/.vitepress/**'
      - '.github/workflows/deploy.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'test/**'
  # 每日构建仅在真正发布新版本并更新 Wiki 后通过 workflow_call 调用本工作流，
  # 避免无新版本（skip=1）时每日空跑或重复部署两次 Pages。
  workflow_call:
  # 浏览器扩展独立发布工作流使用 GITHUB_TOKEN 推送静态包后，通过 workflow_run 触发 Pages 更新。
  workflow_run:
    workflows:
      - 发布 MSM Assistant 浏览器扩展
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      pages_artifact_name: ${{ steps.pages_artifact.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Wiki regression tests
        run: npm test

      - name: Build with VitePress
        run: npm run docs:build

      - name: Set Pages artifact name
        id: pages_artifact
        run: echo "name=github-pages-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist
          name: ${{ steps.pages_artifact.outputs.name }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages (attempt 1)
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.pages_artifact_name }}
        continue-on-error: true

      - name: Wait before retrying Pages deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 15

      - name: Deploy to GitHub Pages (attempt 2)
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.pages_artifact_name }}
